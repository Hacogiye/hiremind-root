<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phiên phân tích — HireMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css?v=202609242030">
  <link rel="stylesheet" href="/css/session.css?v=202609302500">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='9' fill='%236366f1'/%3E%3Cpath d='M11 25V11h3.2v5.6h7.6V11H25v14h-3.2v-5.5h-7.6V25H11z' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <div class="aurora"><div class="blob-3"></div><div class="blob-4"></div></div>
  <div class="aurora-dots"></div>

  <header class="session-header">
    <div class="container">
      <a class="logo" href="/" style="font-size: 1.05rem;">
        <span class="logo-mark" style="width: 32px; height: 32px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 1 4 4c0 1.95-1.4 3.58-3.25 3.93L12.5 22h-1l-.25-12.07A4 4 0 0 1 12 2z"/><path d="M7 12c-2 0-3 1.5-3 3.5S5.5 19 7 19"/><path d="M17 12c2 0 3 1.5 3 3.5S18.5 19 17 19"/></svg>
        </span>
      </a>
      <div class="session-title" style="flex: 1;">
        <div class="t" id="hdTitle">Đang tải phiên phân tích...</div>
        <div class="s" id="hdSub"></div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnCopyLink" title="Copy link phiên" aria-label="Copy link phiên">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
        <button class="icon-btn" data-theme-toggle aria-label="Đổi giao diện sáng/tối">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="/" class="btn btn-soft btn-sm">Phiên mới</a>
      </div>
    </div>
  </header>

  <main class="session-body">
    <div class="container-narrow" id="app"></div>
  </main>

  <div class="toast" id="toast"></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6366f1"/>
        <stop offset="100%" stop-color="#a855f7"/>
      </linearGradient>
    </defs>
  </svg>

  <script src="/js/theme.js?v=202609242030"></script>
  <script src="/js/effects.js?v=202609242030"></script>
  <script src="/js/marked.min.js?v=202609242030"></script>
  <script src="/js/processing.js?v=202609242030"></script>
  <script src="/js/session.js?v=202609302500"></script>
</body>
</html>
